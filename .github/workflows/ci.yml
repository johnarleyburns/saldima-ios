# SPDX-License-Identifier: AGPL-3.0-only
name: ci

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  linux:
    name: Portable logic (Linux, Swift 6.2)
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    container: swift:6.2-noble
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Install SQLite headers
        run: apt-get update && apt-get install -y --no-install-recommends libsqlite3-dev
      - name: Swift tests
        run: swift test -Xswiftc -warnings-as-errors

  apple:
    name: Compile (iOS) and Swift tests
    runs-on: xcode-27
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Select Xcode 27
        run: |
          sudo xcode-select -s /Applications/Xcode_27.2.app
          xcodebuild -version
      - name: Swift 6 guard
        run: bash scripts/check-swift6.sh
      - name: ObservableObject guard
        run: bash scripts/check-observable.sh
      - name: SPDX guard
        run: bash scripts/check-spdx.sh
      - name: Clock/ID seam guard
        run: bash scripts/check-seams.sh
      - name: Dependency licence guard
        run: bash scripts/check-licenses.sh
      - name: Install XcodeGen
        run: brew install xcodegen
      - name: Generate project
        run: xcodegen generate
      - name: Compile for generic iOS
        run: |
          xcodebuild build \
            -project Saldima.xcodeproj \
            -scheme Saldima \
            -destination 'generic/platform=iOS' \
            SALDIMA_SOURCE_COMMIT="${{ github.sha }}" \
            CODE_SIGNING_ALLOWED=NO
      - name: Swift tests on macOS
        run: swift test -Xswiftc -warnings-as-errors

  workflows:
    name: Workflows (actionlint)
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: actionlint
        run: bash scripts/check-workflows.sh
